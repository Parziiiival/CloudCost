# Render Blueprint: one free web service + one free PostgreSQL database.
# No secrets live in this file. DJANGO_SECRET_KEY is generated by Render and
# DEMO_USER_PASSWORD is typed into the Render dashboard when the Blueprint is applied.
databases:
  - name: cloudcost-db
    plan: free
    databaseName: cloudcost
    user: cloudcost

services:
  - type: web
    name: cloudcost-ai
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cloudcost-db
          property: connectionString
      - key: DEMO_USER_PASSWORD
        sync: false
