{% extends "base.html" %}
{% block title %}Upload estimate · CloudCost AI{% endblock %}
{% block content %}
<header class="page-head"><div><h1>Upload Infracost estimate</h1></div></header>
<section class="card narrow">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% include "_form.html" %}
    <p class="help">Nothing is deployed or applied. A sample is in <span class="mono">sample_data/infracost_sample.json</span>.</p>
    <button class="btn btn-primary" type="submit">Upload</button>
    <a class="btn" href="{% url 'estimates' %}">Cancel</a>
  </form>
</section>
{% endblock %}
