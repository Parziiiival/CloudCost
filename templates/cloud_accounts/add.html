{% extends "base.html" %}
{% block title %}Add cloud account · CloudCost AI{% endblock %}
{% block content %}
<header class="page-head"><div><h1>Add cloud account</h1></div></header>
<section class="card narrow">
  <form method="post">
    {% csrf_token %}
    {% include "_form.html" %}
    <button class="btn btn-primary" type="submit">Add account</button>
    <a class="btn" href="{% url 'cloud_accounts' %}">Cancel</a>
  </form>
</section>
{% endblock %}
